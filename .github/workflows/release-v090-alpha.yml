name: Publish v0.90-alpha

on:
  push:
    branches:
      - release/v0.90-alpha

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg curl ca-certificates cmake patch python3-pil zip gh

      - name: Build official Wii U SDL2 port
        run: |
          git clone --depth 1 https://github.com/devkitPro/wut-packages.git /tmp/wut-packages
          curl -L --fail --retry 3 \
            https://libsdl.org/release/SDL2-2.32.10.tar.gz \
            -o /tmp/SDL2-2.32.10.tar.gz
          tar -xzf /tmp/SDL2-2.32.10.tar.gz -C /tmp
          cd /tmp/SDL2-2.32.10
          patch -p1 < /tmp/wut-packages/SDL2/SDL2-2.32.10.patch
          mkdir build
          cd build
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/portlibs/wiiu \
            -DSDL_TEST=OFF
          cmake --build . --parallel 2
          cmake --install .

      - name: Fetch reference visual and audio sources
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Soeiz/Five-Night-at-Freddys-3-PSX.git \
            /tmp/fnaf3-psx-original
          cd /tmp/fnaf3-psx-original
          git checkout f19e22762f48d4269e07730827d8eaab5995557b -- \
            tim/screamer tim/office tim/camera vag/screamer.vag xa/inter8.zip

      - name: Prepare generated assets
        env:
          FNAF3_PSX_SOURCE: /tmp/fnaf3-psx-original
        run: sh tools/prepare_generated_assets.sh

      - name: Build v0.90-alpha
        run: make -j2

      - name: Verify release binary
        run: |
          test -f fnaf3-wiiu.wuhb
          test -f fnaf3-wiiu.rpx
          ls -lh fnaf3-wiiu.wuhb fnaf3-wiiu.rpx

      - name: Create Aroma package
        run: |
          rm -rf release-package
          mkdir -p release-package/fnaf3-wiiu
          cp fnaf3-wiiu.wuhb release-package/fnaf3-wiiu/fnaf3-wiiu.wuhb
          cat > release-package/fnaf3-wiiu/README.txt <<'EOF'
          Five Nights at Freddy's 3 - Wii U Edition v0.90-alpha

          Aroma installation:
          Copy the fnaf3-wiiu folder to SD:/wiiu/apps/

          Final path:
          SD:/wiiu/apps/fnaf3-wiiu/fnaf3-wiiu.wuhb

          This is an alpha/pre-release build intended for testing.
          EOF
          cd release-package
          zip -r ../fnaf3-wiiu-v0.90-alpha.zip fnaf3-wiiu
          cd ..

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.90-alpha \
            fnaf3-wiiu-v0.90-alpha.zip \
            fnaf3-wiiu.wuhb \
            fnaf3-wiiu.rpx \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "FNaF 3 Wii U Edition v0.90-alpha" \
            --notes-file .github/release-notes-v0.90-alpha.md \
            --prerelease
