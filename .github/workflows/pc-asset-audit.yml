name: Audit PC FNAF3 assets

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip python3-pil

      - name: Fetch original PC minigame sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asset-audit/minigames
          python3 - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin

          assets = {
              "follow_me": 143651,
              "happiest_day": 143704,
              "shadow_bonnie": 143705,
              "stage_01": 143706,
              "chicas_party": 143707,
              "mangles_quest": 143708,
              "bb_air_adventure": 143709,
          }
          out = Path("asset-audit/minigames")
          for name, asset_id in assets.items():
              page_url = f"https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/{asset_id}/"
              page = out / f".{name}.html"
              subprocess.run([
                  "curl", "--http1.1", "-L", "--fail", "--retry", "5",
                  "--retry-all-errors", "--retry-delay", "2", "-A", "Mozilla/5.0",
                  page_url, "-o", str(page)
              ], check=True)
              text = html.unescape(page.read_text(encoding="utf-8", errors="ignore"))
              matches = re.findall(r'''(?:https?:)?//[^"'<>\s]+/media/assets/[^"'<>\s]+?\.png(?:\?[^"'<>\s]*)?''', text, flags=re.I)
              if not matches:
                  matches = re.findall(r'''(?:src|href)=["']([^"']+\.png(?:\?[^"']*)?)["']''', text, flags=re.I)
              urls = []
              for value in matches:
                  if value.startswith("//"):
                      value = "https:" + value
                  value = urljoin(page_url, value)
                  if str(asset_id) in value and value not in urls:
                      urls.append(value)
              if not urls:
                  raise SystemExit(f"Could not resolve PNG for {name} ({asset_id})")
              url = urls[0]
              target = out / f"{name}.png"
              print(f"{name}: {url}")
              subprocess.run([
                  "curl", "--http1.1", "-L", "--fail", "--retry", "5",
                  "--retry-all-errors", "--retry-delay", "2", "-A", "Mozilla/5.0",
                  "-H", f"Referer: {page_url}", url, "-o", str(target)
              ], check=True)
              page.unlink(missing_ok=True)
          PY

      - name: Fetch General Sprites and build full-screen candidate sheets
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PAGE="https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0" "$ASSET_PAGE" -o /tmp/general.html
          DOWNLOAD_URL="$(python3 - <<'PY'
          import html, re
          from urllib.parse import urljoin
          page = "https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          text = html.unescape(open('/tmp/general.html', encoding='utf-8', errors='ignore').read())
          candidates = re.findall(r'''(?:href|data-url|data-download|action)\s*=\s*["']([^"']+)["']''', text, flags=re.I)
          candidates += re.findall(r'''https?://[^"'<>\s]+''', text)
          ranked = []
          for value in candidates:
              low = value.lower()
              if low.endswith('.zip') or 'download' in low or '65675' in low:
                  absolute = urljoin(page, value)
                  if absolute.rstrip('/') != page.rstrip('/') and absolute not in ranked:
                      ranked.append(absolute)
          ranked.sort(key=lambda value: (not value.lower().split('?')[0].endswith('.zip'), 'download' not in value.lower(), len(value)))
          if ranked:
              print(ranked[0])
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl --http1.1 -L --fail --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 -A "Mozilla/5.0" -H "Referer: $ASSET_PAGE" \
            "$DOWNLOAD_URL" -o /tmp/general.zip
          echo "b083700bfbcbe0254c59a3f4acf451f6c647c20719a6db2ea29c8f4a644c6a23  /tmp/general.zip" | sha256sum -c -
          unzip -q /tmp/general.zip -d /tmp/general
          mkdir -p asset-audit/general_candidates
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import math

          root = Path('/tmp/general/DataDump3')
          candidates = []
          for path in root.glob('*.png'):
              try:
                  with Image.open(path) as image:
                      w, h = image.size
              except Exception:
                  continue
              # Broad enough to catch endings/newspaper/full-screen panels while
              # avoiding the hundreds of tiny character frames.
              if w >= 420 and h >= 220 and 1.05 <= (w / h) <= 2.35:
                  candidates.append((int(path.stem), path, w, h))
          candidates.sort()
          print(f"fullscreen candidates: {len(candidates)}")
          out = Path('asset-audit/general_candidates')
          rows, cols = 5, 4
          thumb_w, thumb_h = 240, 150
          label_h = 24
          per_page = rows * cols
          for page_index in range(math.ceil(len(candidates) / per_page)):
              page_items = candidates[page_index*per_page:(page_index+1)*per_page]
              sheet = Image.new('RGB', (cols*thumb_w, rows*(thumb_h+label_h)), (32, 32, 32))
              draw = ImageDraw.Draw(sheet)
              for slot, (sprite_id, path, w, h) in enumerate(page_items):
                  image = Image.open(path).convert('RGB')
                  image.thumbnail((thumb_w-8, thumb_h-8), Image.Resampling.LANCZOS)
                  col = slot % cols
                  row = slot // cols
                  x = col*thumb_w + (thumb_w-image.width)//2
                  y = row*(thumb_h+label_h) + (thumb_h-image.height)//2
                  sheet.paste(image, (x, y))
                  draw.text((col*thumb_w+5, row*(thumb_h+label_h)+thumb_h+3), f"ID {sprite_id}  {w}x{h}", fill=(255,255,255))
              sheet.save(out / f'candidates_{page_index:02d}.jpg', quality=88)
          with open(out / 'candidates.txt', 'w', encoding='utf-8') as handle:
              for sprite_id, _path, w, h in candidates:
                  handle.write(f"{sprite_id}\t{w}x{h}\n")
          PY

      - name: Upload PC asset audit
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-pc-asset-audit
          if-no-files-found: error
          path: asset-audit/
