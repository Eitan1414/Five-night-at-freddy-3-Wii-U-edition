name: Wii U WUP Diagnostic Exact NUSspli Tree v4

on:
  push:
    branches:
      - fix/restore-phone-subtitles

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl python3-pil openjdk-17-jre-headless

      - name: Build minimal official wut diagnostic RPX
        run: |
          make -C tools/wup_diag clean all
          test -s tools/wup_diag/diagnostic.rpx

      - name: Reproduce NUSspli Channel input tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NUSspli build/wup-nusspli-v4 dist/wup-nusspli-v4
          git clone --depth 1 https://github.com/V10lator/NUSspli.git /tmp/NUSspli

          mkdir -p build/wup-nusspli-v4/code build/wup-nusspli-v4/content dist/wup-nusspli-v4
          cp -a /tmp/NUSspli/meta/menu build/wup-nusspli-v4/meta
          find build/wup-nusspli-v4/meta -name '*.xcf' -delete

          mv build/wup-nusspli-v4/meta/app.xml build/wup-nusspli-v4/code/app.xml
          mv build/wup-nusspli-v4/meta/cos.xml build/wup-nusspli-v4/code/cos.xml
          cp tools/wup_diag/diagnostic.rpx build/wup-nusspli-v4/code/diagnostic.rpx
          printf '%s\n' 'FNaF3 WUP diagnostic v4 - exact NUSspli Channel tree' > build/wup-nusspli-v4/content/channel.txt

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('build/wup-nusspli-v4')
          title_id = '000500001337D1A2'
          # Deliberately keep NUSspli's proven group_id 00000812.
          group_id = '00000812'

          app_path = root/'code'/'app.xml'
          app = ET.parse(app_path)
          ar = app.getroot()
          ar.find('title_id').text = title_id
          ar.find('group_id').text = group_id
          app.write(app_path, encoding='utf-8', xml_declaration=True)

          cos_path = root/'code'/'cos.xml'
          cos = ET.parse(cos_path)
          cr = cos.getroot()
          cr.find('argstr').text = 'diagnostic.rpx'
          cos.write(cos_path, encoding='utf-8', xml_declaration=True)

          meta_path = root/'meta'/'meta.xml'
          meta = ET.parse(meta_path)
          mr = meta.getroot()
          mr.find('title_id').text = title_id
          mr.find('group_id').text = group_id
          mr.find('product_code').text = 'WUP-P-DG4U'
          for child in mr:
              if child.tag.startswith('longname_'):
                  child.text = 'FNaF3 WUP Diagnostic v4'
              elif child.tag.startswith('shortname_'):
                  child.text = 'FNaF3 DIAG v4'
              elif child.tag.startswith('publisher_'):
                  child.text = 'Eitan1414'
          meta.write(meta_path, encoding='utf-8', xml_declaration=True)

          assert ar.find('version').text == '1'
          assert cr.find('version').text == '1'
          assert mr.find('version').text == '1'
          assert mr.find('launching_flag').text == '00000004'
          assert mr.find('closing_msg').text == '1'
          assert mr.find('reserved_flag0').text == '00010002'
          for required in ('iconTex.tga','bootTvTex.tga','bootDrcTex.tga','bootLogoTex.tga','bootMovie.h264','bootSound.btsnd','title.cert','title.tik'):
              p = root/'meta'/required
              assert p.is_file() and p.stat().st_size > 0, required
          print('Exact NUSspli-style Channel tree prepared')
          PY

          find build/wup-nusspli-v4 -maxdepth 2 -type f -printf '%P %s bytes\n' | sort

      - name: Pack with NUSPacker
        run: |
          test -n "$WIIU_COMMON_KEY"
          test "${#WIIU_COMMON_KEY}" -eq 32
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Maschell/nuspacker/master/NUSPacker.jar -o /tmp/NUSPacker.jar
          java -jar /tmp/NUSPacker.jar \
            -in build/wup-nusspli-v4 \
            -out dist/wup-nusspli-v4 \
            -encryptKeyWith "$WIIU_COMMON_KEY"

      - name: Validate package
        run: |
          python3 tools/validate_wup.py \
            dist/wup-nusspli-v4 \
            build/wup-nusspli-v4/code/app.xml \
            build/wup-nusspli-v4/meta/meta.xml
          test -s dist/wup-nusspli-v4/title.tmd
          test -s dist/wup-nusspli-v4/title.tik
          test -s dist/wup-nusspli-v4/title.cert
          find dist/wup-nusspli-v4 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload exact-tree diagnostic WUP
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup-diagnostic-nusspli-v4
          if-no-files-found: error
          path: dist/wup-nusspli-v4/*
