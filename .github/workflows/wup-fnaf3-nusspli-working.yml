name: Real FNAF3 WUP - Hardware Working Layout

on:
  push:
    branches:
      - fix/restore-phone-subtitles

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl unzip python3-pil openjdk-17-jre-headless

      - name: Download verified real FNAF3 RPX from successful run 797
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9231588438/zip" \
            -o /tmp/fnaf3-run797.zip
          mkdir -p /tmp/fnaf3-run797
          unzip -q /tmp/fnaf3-run797.zip -d /tmp/fnaf3-run797
          test -s /tmp/fnaf3-run797/fnaf3-wiiu.rpx
          sha256sum /tmp/fnaf3-run797/fnaf3-wiiu.rpx
          ls -lh /tmp/fnaf3-run797/fnaf3-wiiu.rpx

      - name: Reproduce hardware-working NUSspli Channel layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NUSspli build/wup-fnaf3-hw dist/wup-fnaf3-hw
          git clone --depth 1 https://github.com/V10lator/NUSspli.git /tmp/NUSspli

          mkdir -p build/wup-fnaf3-hw/code build/wup-fnaf3-hw/content dist/wup-fnaf3-hw
          cp -a /tmp/NUSspli/meta/menu build/wup-fnaf3-hw/meta
          find build/wup-fnaf3-hw/meta -name '*.xcf' -delete

          mv build/wup-fnaf3-hw/meta/app.xml build/wup-fnaf3-hw/code/app.xml
          mv build/wup-fnaf3-hw/meta/cos.xml build/wup-fnaf3-hw/code/cos.xml
          cp /tmp/fnaf3-run797/fnaf3-wiiu.rpx build/wup-fnaf3-hw/code/fnaf3-wiiu.rpx
          printf '%s\n' 'Five Nights at Freddys 3 - Wii U Edition' > build/wup-fnaf3-hw/content/channel.txt

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import xml.etree.ElementTree as ET

          root = Path('build/wup-fnaf3-hw')
          title_id = '000500001337F3A4'
          group_id = '00000812'

          app_path = root/'code'/'app.xml'
          app = ET.parse(app_path)
          ar = app.getroot()
          ar.find('title_id').text = title_id
          ar.find('group_id').text = group_id
          app.write(app_path, encoding='utf-8', xml_declaration=True)

          cos_path = root/'code'/'cos.xml'
          cos = ET.parse(cos_path)
          cr = cos.getroot()
          cr.find('argstr').text = 'fnaf3-wiiu.rpx'
          cos.write(cos_path, encoding='utf-8', xml_declaration=True)

          meta_path = root/'meta'/'meta.xml'
          meta = ET.parse(meta_path)
          mr = meta.getroot()
          mr.find('title_id').text = title_id
          mr.find('group_id').text = group_id
          mr.find('product_code').text = 'WUP-P-F3WU'
          mr.find('network_use').text = '0'
          mr.find('bg_daemon_enable').text = '0'
          mr.find('common_save_size').text = '0000000000000000'
          mr.find('account_save_size').text = '0000000000100000'
          for child in mr:
              if child.tag.startswith('longname_'):
                  child.text = "Five Nights at Freddy's 3 - Wii U Edition"
              elif child.tag.startswith('shortname_'):
                  child.text = 'FNaF 3 Wii U'
              elif child.tag.startswith('publisher_'):
                  child.text = 'Pixel Electronics Studio'
          meta.write(meta_path, encoding='utf-8', xml_declaration=True)

          try:
              resampling = Image.Resampling.LANCZOS
          except AttributeError:
              resampling = Image.LANCZOS

          # icon.jpg is the verified valid project artwork. Build every static boot image from it.
          icon_src = Image.open('icon.jpg').convert('RGBA')
          icon = ImageOps.fit(icon_src, (128, 128), method=resampling)
          icon.save(root/'meta'/'iconTex.tga', format='TGA')

          def make_boot(size):
              canvas = Image.new('RGB', size, (0, 0, 0))
              art = icon_src.convert('RGB').copy()
              max_side = int(min(size) * 0.42)
              art.thumbnail((max_side, max_side), resampling)
              canvas.paste(art, ((size[0]-art.width)//2, (size[1]-art.height)//2))
              return canvas

          make_boot((1280, 720)).save(root/'meta'/'bootTvTex.tga', format='TGA')
          make_boot((854, 480)).save(root/'meta'/'bootDrcTex.tga', format='TGA')

          logo = Image.new('RGBA', (170, 42), (0, 0, 0, 0))
          mini = icon.copy()
          mini.thumbnail((42, 42), resampling)
          logo.alpha_composite(mini, ((170-mini.width)//2, (42-mini.height)//2))
          logo.save(root/'meta'/'bootLogoTex.tga', format='TGA')

          assert ar.find('version').text == '1'
          assert cr.find('version').text == '1'
          assert mr.find('version').text == '1'
          assert mr.find('launching_flag').text == '00000004'
          assert mr.find('closing_msg').text == '1'
          assert mr.find('reserved_flag0').text == '00010002'
          for required in ('iconTex.tga','bootTvTex.tga','bootDrcTex.tga','bootLogoTex.tga'):
              p = root/'meta'/required
              assert p.is_file() and p.stat().st_size > 0, required
          print('Real FNAF3 channel tree ready with FNAF3 branding')
          PY

          find build/wup-fnaf3-hw -maxdepth 2 -type f -printf '%P %s bytes\n' | sort

      - name: Pack with NUSPacker
        run: |
          test -n "$WIIU_COMMON_KEY"
          test "${#WIIU_COMMON_KEY}" -eq 32
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Maschell/nuspacker/master/NUSPacker.jar -o /tmp/NUSPacker.jar
          java -jar /tmp/NUSPacker.jar \
            -in build/wup-fnaf3-hw \
            -out dist/wup-fnaf3-hw \
            -encryptKeyWith "$WIIU_COMMON_KEY"

      - name: Validate real FNAF3 WUP
        run: |
          python3 tools/validate_wup.py \
            dist/wup-fnaf3-hw \
            build/wup-fnaf3-hw/code/app.xml \
            build/wup-fnaf3-hw/meta/meta.xml
          test -s dist/wup-fnaf3-hw/title.tmd
          test -s dist/wup-fnaf3-hw/title.tik
          test -s dist/wup-fnaf3-hw/title.cert
          find dist/wup-fnaf3-hw -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload real FNAF3 hardware-test WUP
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-real-hardware-working-layout
          if-no-files-found: error
          path: dist/wup-fnaf3-hw/*
