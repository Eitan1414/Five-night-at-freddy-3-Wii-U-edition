name: FNAF3 Real Hardware V9 WUP

on:
  push:
    branches:
      - fix/restore-phone-subtitles

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl unzip ffmpeg python3-pil openjdk-17-jre-headless

      - name: Download corrected RPX from build 828
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9236090295/zip" \
            -o /tmp/fnaf3-v9.zip
          mkdir -p /tmp/fnaf3-v9
          unzip -q /tmp/fnaf3-v9.zip -d /tmp/fnaf3-v9
          test -s /tmp/fnaf3-v9/fnaf3-wiiu.rpx
          sha256sum /tmp/fnaf3-v9/fnaf3-wiiu.rpx

      - name: Prepare hardware-working channel tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/NUSspli build/wup-fnaf3-v9 dist/wup-fnaf3-v9
          git clone --depth 1 https://github.com/V10lator/NUSspli.git /tmp/NUSspli

          SPLASH_COMMIT=ccd0bfc082e39743b071b953106c4414535d5acd
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SPLASH_COMMIT}/boot-tv.jpg" \
            -o /tmp/fnaf3-boot-tv-old.jpg
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SPLASH_COMMIT}/boot-drc.jpg" \
            -o /tmp/fnaf3-boot-drc-old.jpg

          # The historical JPEGs contain enough picture data for ffmpeg's MJPEG
          # decoder even though Pillow/libjpeg rejects their broken tail. Decode
          # one frame to a clean PNG before generating Wii U TGAs.
          ffmpeg -hide_banner -loglevel warning -err_detect ignore_err \
            -i /tmp/fnaf3-boot-tv-old.jpg -frames:v 1 -y /tmp/fnaf3-boot-tv.png
          ffmpeg -hide_banner -loglevel warning -err_detect ignore_err \
            -i /tmp/fnaf3-boot-drc-old.jpg -frames:v 1 -y /tmp/fnaf3-boot-drc.png
          test -s /tmp/fnaf3-boot-tv.png
          test -s /tmp/fnaf3-boot-drc.png

          mkdir -p build/wup-fnaf3-v9/code build/wup-fnaf3-v9/content dist/wup-fnaf3-v9
          cp -a /tmp/NUSspli/meta/menu build/wup-fnaf3-v9/meta
          find build/wup-fnaf3-v9/meta -name '*.xcf' -delete
          mv build/wup-fnaf3-v9/meta/app.xml build/wup-fnaf3-v9/code/app.xml
          mv build/wup-fnaf3-v9/meta/cos.xml build/wup-fnaf3-v9/code/cos.xml
          cp /tmp/fnaf3-v9/fnaf3-wiiu.rpx build/wup-fnaf3-v9/code/fnaf3-wiiu.rpx
          printf '%s\n' "Five Nights at Freddy's 3 - Wii U Edition" > build/wup-fnaf3-v9/content/channel.txt

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import xml.etree.ElementTree as ET

          root = Path('build/wup-fnaf3-v9')
          title_id = '000500001337F3A5'
          group_id = '00000812'

          app_path = root/'code'/'app.xml'
          app = ET.parse(app_path)
          ar = app.getroot()
          ar.find('title_id').text = title_id
          ar.find('group_id').text = group_id
          app.write(app_path, encoding='utf-8', xml_declaration=True)

          cos_path = root/'code'/'cos.xml'
          cos = ET.parse(cos_path)
          cr = cos.getroot()
          cr.find('argstr').text = 'fnaf3-wiiu.rpx'
          cos.write(cos_path, encoding='utf-8', xml_declaration=True)

          meta_path = root/'meta'/'meta.xml'
          meta = ET.parse(meta_path)
          mr = meta.getroot()
          mr.find('title_id').text = title_id
          mr.find('group_id').text = group_id
          mr.find('product_code').text = 'WUP-P-F3V9'
          mr.find('network_use').text = '0'
          mr.find('bg_daemon_enable').text = '0'
          mr.find('common_save_size').text = '0000000000000000'
          mr.find('account_save_size').text = '0000000000100000'
          for child in mr:
              if child.tag.startswith('longname_'):
                  child.text = "Five Nights at Freddy's 3 - Wii U Edition"
              elif child.tag.startswith('shortname_'):
                  child.text = 'FNaF 3 Wii U'
              elif child.tag.startswith('publisher_'):
                  child.text = 'Pixel Electronics Studio'
          meta.write(meta_path, encoding='utf-8', xml_declaration=True)

          try:
              rs = Image.Resampling.LANCZOS
          except AttributeError:
              rs = Image.LANCZOS

          icon = Image.open('icon.jpg').convert('RGBA')
          icon = ImageOps.fit(icon, (128, 128), method=rs)
          icon.save(root/'meta'/'iconTex.tga', format='TGA')

          tv = Image.open('/tmp/fnaf3-boot-tv.png').convert('RGB')
          print('Recovered TV splash:', tv.size)
          tv = ImageOps.fit(tv, (1280, 720), method=rs)
          tv.save(root/'meta'/'bootTvTex.tga', format='TGA')

          drc = Image.open('/tmp/fnaf3-boot-drc.png').convert('RGB')
          print('Recovered DRC splash:', drc.size)
          drc = ImageOps.fit(drc, (854, 480), method=rs)
          drc.save(root/'meta'/'bootDrcTex.tga', format='TGA')

          logo = Image.new('RGBA', (170, 42), (0, 0, 0, 0))
          mini = icon.copy()
          mini.thumbnail((42, 42), rs)
          logo.alpha_composite(mini, ((170-mini.width)//2, (42-mini.height)//2))
          logo.save(root/'meta'/'bootLogoTex.tga', format='TGA')

          assert ar.find('version').text == '1'
          assert cr.find('version').text == '1'
          assert mr.find('version').text == '1'
          PY

      - name: Pack with NUSPacker
        run: |
          test -n "$WIIU_COMMON_KEY"
          test "${#WIIU_COMMON_KEY}" -eq 32
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Maschell/nuspacker/master/NUSPacker.jar -o /tmp/NUSPacker.jar
          java -jar /tmp/NUSPacker.jar \
            -in build/wup-fnaf3-v9 \
            -out dist/wup-fnaf3-v9 \
            -encryptKeyWith "$WIIU_COMMON_KEY"

      - name: Validate WUP
        run: |
          python3 tools/validate_wup.py \
            dist/wup-fnaf3-v9 \
            build/wup-fnaf3-v9/code/app.xml \
            build/wup-fnaf3-v9/meta/meta.xml
          test -s dist/wup-fnaf3-v9/title.tmd
          test -s dist/wup-fnaf3-v9/title.tik
          test -s dist/wup-fnaf3-v9/title.cert

      - name: Upload corrected real-hardware WUP
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-real-hardware-v9
          if-no-files-found: error
          path: dist/wup-fnaf3-v9/*
