name: PC Minigame Visual Audit

on:
  push:
    branches:
      - pc-minigame-visual-v8

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original PC minigame sprite sheets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 - <<'PY'
          import html, re, subprocess
          from pathlib import Path
          from urllib.parse import urljoin
          assets = {
              "happiest_day": 143704,
              "shadow_bonnie": 143705,
              "stage_01": 143706,
              "chicas_party": 143707,
              "mangles_quest": 143708,
              "bb_air_adventure": 143709,
          }
          out = Path("audit")
          for name, asset_id in assets.items():
              page_url = f"https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/{asset_id}/"
              page = out / f".{name}.html"
              subprocess.run(["curl","--http1.1","-L","--fail","--retry","5","--retry-all-errors","-A","Mozilla/5.0",page_url,"-o",str(page)],check=True)
              text = html.unescape(page.read_text(encoding="utf-8", errors="ignore"))
              matches = re.findall(r'''(?:https?:)?//[^"'<>\s]+/media/assets/[^"'<>\s]+?\.png(?:\?[^"'<>\s]*)?''', text, flags=re.I)
              urls=[]
              for value in matches:
                  if value.startswith("//"): value = "https:" + value
                  value = urljoin(page_url, value)
                  if str(asset_id) in value and value not in urls: urls.append(value)
              if not urls: raise SystemExit(f"No PNG for {name}")
              target = out / f"{name}.png"
              subprocess.run(["curl","--http1.1","-L","--fail","--retry","5","--retry-all-errors","-A","Mozilla/5.0","-H",f"Referer: {page_url}",urls[0],"-o",str(target)],check=True)
              page.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pc-minigame-visual-audit
          path: audit/*.png
          if-no-files-found: error
