name: Build Installable WUP Run 797

on:
  push:
    branches:
      - fix/restore-phone-subtitles

permissions:
  actions: read
  contents: read

jobs:
  package-wup:
    runs-on: ubuntu-latest
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}

    steps:
      - name: Checkout packaging scripts
        uses: actions/checkout@v4

      - name: Install WUP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates python3-pil unzip openjdk-17-jre-headless

      - name: Verify WUP key is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WIIU_COMMON_KEY:-}" ]; then
            echo "::error::ENC_KEY repository secret is missing."
            exit 1
          fi
          if [[ ! "$WIIU_COMMON_KEY" =~ ^[0-9A-Fa-f]{32}$ ]]; then
            echo "::error::ENC_KEY has an invalid format."
            exit 1
          fi

      - name: Download verified Wii U build from run 797
        uses: actions/download-artifact@v4
        with:
          name: fnaf3-wiiu
          path: .
          github-token: ${{ github.token }}
          run-id: 31833335328

      - name: Verify RPX input
        run: |
          test -s fnaf3-wiiu.rpx
          ls -lh fnaf3-wiiu.rpx

      - name: Build installable WUP channel
        run: sh tools/build_wup_channel.sh

      - name: Validate installable WUP package
        run: python3 tools/validate_wup.py dist/fnaf3-wiiu-wup wup/app.xml wup/meta.xml

      - name: List WUP package
        run: |
          find dist/fnaf3-wiiu-wup -maxdepth 1 -type f -printf '%f\n' | sort
          du -sh dist/fnaf3-wiiu-wup

      - name: Upload installable WUP build
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup-run797
          if-no-files-found: error
          path: dist/fnaf3-wiiu-wup/*
