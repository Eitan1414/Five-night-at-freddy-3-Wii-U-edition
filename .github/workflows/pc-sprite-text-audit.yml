name: PC Sprite Text Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl unzip python3 python3-pil tesseract-ocr

      - name: Fetch verified PC General Sprites source
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PAGE="https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          mkdir -p /tmp/fnaf3-pc-general
          curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0" "$ASSET_PAGE" -o /tmp/fnaf3-general-page.html
          DOWNLOAD_URL="$(python3 - <<'PY'
          import html, re
          from urllib.parse import urljoin
          page_url = "https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          text = html.unescape(open('/tmp/fnaf3-general-page.html', encoding='utf-8', errors='ignore').read())
          candidates = []
          for pattern in [r'''href\s*=\s*["']([^"']+)["']''', r'''(?:data-url|data-download|action)\s*=\s*["']([^"']+)["']''']:
              for value in re.findall(pattern, text, flags=re.I):
                  low = value.lower()
                  if ("download" in low or low.endswith('.zip') or '65675' in low) and value not in candidates:
                      candidates.append(value)
          ranked = sorted(candidates, key=lambda v: (not v.lower().endswith('.zip'), 'download' not in v.lower(), '65675' not in v, len(v)))
          for value in ranked:
              absolute = urljoin(page_url, value)
              if absolute.rstrip('/') != page_url.rstrip('/'):
                  print(absolute)
                  break
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl --http1.1 -L --fail --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 -A "Mozilla/5.0" \
            -H "Referer: $ASSET_PAGE" "$DOWNLOAD_URL" -o /tmp/fnaf3-general-sprites.zip
          echo "b083700bfbcbe0254c59a3f4acf451f6c647c20719a6db2ea29c8f4a644c6a23  /tmp/fnaf3-general-sprites.zip" | sha256sum -c -
          unzip -q /tmp/fnaf3-general-sprites.zip -d /tmp/fnaf3-pc-general

      - name: Audit clock neighborhood and text sprites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re, subprocess, tempfile

          root = Path('/tmp/fnaf3-pc-general/DataDump3')
          print('=== IDs 220..260: size and visible alpha bbox ===')
          for sprite_id in range(220, 261):
              path = root / f'{sprite_id}.png'
              if not path.is_file():
                  continue
              im = Image.open(path).convert('RGBA')
              alpha = im.getchannel('A')
              bbox = alpha.getbbox()
              print(f'ID {sprite_id}: size={im.size} alpha_bbox={bbox}')

          print('=== OCR keyword candidates ===')
          keywords = re.compile(r'(seal|vent|game|over|night|am|5.?59|6.?00)', re.I)
          hits = []
          for path in sorted(root.glob('*.png'), key=lambda p: int(p.stem)):
              try:
                  im = Image.open(path).convert('RGBA')
              except Exception:
                  continue
              w, h = im.size
              if h > 180 or w > 700 or w < 4 or h < 4:
                  continue
              alpha = im.getchannel('A')
              if alpha.getbbox() is None:
                  continue
              # Composite on black, enlarge hard-edged UI text, and try both
              # normal and inverted luminance because the bank mixes white,
              # green, red, and black-keyed Clickteam text objects.
              base = Image.new('RGB', im.size, 'black')
              base.paste(im.convert('RGB'), mask=alpha)
              scale = max(4, min(10, 640 // max(1, w)))
              enlarged = base.resize((w * scale, h * scale), Image.Resampling.NEAREST)
              variants = [enlarged, ImageOps.invert(enlarged)]
              text = ''
              for variant in variants:
                  with tempfile.NamedTemporaryFile(suffix='.png') as tmp:
                      variant.save(tmp.name)
                      proc = subprocess.run(['tesseract', tmp.name, 'stdout', '--psm', '7'], capture_output=True, text=True)
                      candidate = ' '.join(proc.stdout.split())
                      if len(candidate) > len(text):
                          text = candidate
              if text and keywords.search(text):
                  hits.append((int(path.stem), im.size, text))
          for sprite_id, size, text in hits:
              print(f'OCR HIT ID {sprite_id}: size={size} text={text!r}')
          print(f'OCR hit count: {len(hits)}')
          PY
