name: PC Sprite Text Audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install audit tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl unzip python3 python3-pil

      - name: Fetch verified PC General Sprites source
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PAGE="https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          mkdir -p /tmp/fnaf3-pc-general
          curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
            -A "Mozilla/5.0" "$ASSET_PAGE" -o /tmp/fnaf3-general-page.html
          DOWNLOAD_URL="$(python3 - <<'PY'
          import html, re
          from urllib.parse import urljoin
          page_url = "https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          text = html.unescape(open('/tmp/fnaf3-general-page.html', encoding='utf-8', errors='ignore').read())
          candidates = []
          for pattern in [r'''href\s*=\s*["']([^"']+)["']''', r'''(?:data-url|data-download|action)\s*=\s*["']([^"']+)["']''']:
              for value in re.findall(pattern, text, flags=re.I):
                  low = value.lower()
                  if ("download" in low or low.endswith('.zip') or '65675' in low) and value not in candidates:
                      candidates.append(value)
          ranked = sorted(candidates, key=lambda v: (not v.lower().endswith('.zip'), 'download' not in v.lower(), '65675' not in v, len(v)))
          for value in ranked:
              absolute = urljoin(page_url, value)
              if absolute.rstrip('/') != page_url.rstrip('/'):
                  print(absolute)
                  break
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl --http1.1 -L --fail --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 -A "Mozilla/5.0" \
            -H "Referer: $ASSET_PAGE" "$DOWNLOAD_URL" -o /tmp/fnaf3-general-sprites.zip
          echo "b083700bfbcbe0254c59a3f4acf451f6c647c20719a6db2ea29c8f4a644c6a23  /tmp/fnaf3-general-sprites.zip" | sha256sum -c -
          unzip -q /tmp/fnaf3-general-sprites.zip -d /tmp/fnaf3-pc-general

      - name: Dump larger counter glyph neighborhood
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/fnaf3-pc-general/DataDump3')
          print('=== PC General Sprites IDs 254..275 ===')
          for sprite_id in range(254, 276):
              path = root / f'{sprite_id}.png'
              if not path.is_file():
                  print(f'ID {sprite_id}: MISSING')
                  continue
              im = Image.open(path).convert('RGBA')
              colours = Counter((r, g, b) for r, g, b, a in im.getdata() if a >= 32)
              bright = sum(n for (r, g, b), n in colours.items() if max(r, g, b) >= 48)
              print(f'\nID {sprite_id} size={im.size} bright={bright} top_colours={colours.most_common(4)}')
              if im.width > 50 or im.height > 60:
                  continue
              for y in range(im.height):
                  row = []
                  for x in range(im.width):
                      r, g, b, a = im.getpixel((x, y))
                      if a < 32 or max(r, g, b) < 48:
                          row.append('.')
                      else:
                          v = max(r, g, b)
                          row.append('#' if v >= 160 else '+' if v >= 96 else ':')
                  print(''.join(row))
          PY
