name: Wii U Installed WUP Diagnostic

on:
  push:
    branches:
      - fix/restore-phone-subtitles

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl python3-pil openjdk-17-jre-headless

      - name: Build minimal official-style wut RPX
        run: |
          make -C tools/wup_diag clean all
          test -s tools/wup_diag/diagnostic.rpx
          cp tools/wup_diag/diagnostic.rpx fnaf3-wiiu.rpx
          ls -lh tools/wup_diag/diagnostic.rpx fnaf3-wiiu.rpx

      - name: Prepare diagnostic channel metadata
        run: |
          sed -i 's#<launching_flag type="hexBinary" length="4">00000004</launching_flag>#<launching_flag type="hexBinary" length="4">00000005</launching_flag>#' wup/meta.xml
          sed -i 's#<closing_msg type="unsignedInt" length="4">1</closing_msg>#<closing_msg type="unsignedInt" length="4">0</closing_msg>#' wup/meta.xml
          sed -i 's#<reserved_flag0 type="hexBinary" length="4">00010002</reserved_flag0>#<reserved_flag0 type="hexBinary" length="4">00010001</reserved_flag0>#' wup/meta.xml
          sed -i "s#Five Nights at Freddy's 3 - Wii U Edition#FNaF3 WUP Diagnostic#g" wup/meta.xml
          sed -i 's#FNaF3 Wii U#FNaF3 DIAG#g' wup/meta.xml
          grep -F 'FNaF3 WUP Diagnostic' wup/meta.xml

      - name: Build diagnostic WUP
        run: |
          test -n "$WIIU_COMMON_KEY"
          test "${#WIIU_COMMON_KEY}" -eq 32
          sh tools/build_wup_channel.sh

      - name: Validate diagnostic WUP
        run: |
          python3 tools/validate_wup.py \
            dist/fnaf3-wiiu-wup \
            build/wup-channel/code/app.xml \
            build/wup-channel/meta/meta.xml
          test -s dist/fnaf3-wiiu-wup/title.tmd
          test -s dist/fnaf3-wiiu-wup/title.tik
          test -s dist/fnaf3-wiiu-wup/title.cert

      - name: Upload diagnostic WUP
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup-diagnostic
          if-no-files-found: error
          path: dist/fnaf3-wiiu-wup/*
