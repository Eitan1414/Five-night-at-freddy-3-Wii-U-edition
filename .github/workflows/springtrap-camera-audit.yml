name: Springtrap Camera Audit

on:
  push:
    branches:
      - springtrap-camera-v9

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install --user pillow
      - name: Fetch verified PC General Sprites
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PAGE="https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          curl --http1.1 -L --fail --retry 5 --retry-all-errors -A "Mozilla/5.0" "$ASSET_PAGE" -o /tmp/page.html
          DOWNLOAD_URL="$(python3 - <<'PY'
          import html,re
          from urllib.parse import urljoin
          page='https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/'
          text=html.unescape(open('/tmp/page.html',encoding='utf-8',errors='ignore').read())
          vals=[]
          for pat in [r'''href\s*=\s*["']([^"']+)["']''',r'''(?:data-url|data-download|action)\s*=\s*["']([^"']+)["']''']:
              for value in re.findall(pat,text,re.I):
                  low=value.lower()
                  if ('download' in low or low.endswith('.zip') or '65675' in low) and value not in vals: vals.append(value)
          vals.sort(key=lambda v:(not v.lower().endswith('.zip'),'download' not in v.lower(),'65675' not in v,len(v)))
          for value in vals:
              u=urljoin(page,value)
              if u.rstrip('/') != page.rstrip('/'):
                  print(u); break
          PY
          )"
          test -n "$DOWNLOAD_URL"
          curl --http1.1 -L --fail --retry 10 --retry-all-errors --retry-delay 3 -A "Mozilla/5.0" -H "Referer: $ASSET_PAGE" "$DOWNLOAD_URL" -o /tmp/general.zip
          echo "b083700bfbcbe0254c59a3f4acf451f6c647c20719a6db2ea29c8f4a644c6a23  /tmp/general.zip" | sha256sum -c -
          unzip -q /tmp/general.zip -d /tmp/general
      - name: Find camera-family composites
        run: |
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFont,ImageStat,ImageChops
          import csv, math
          root=Path('/tmp/general/DataDump3')
          bases={1:106,2:97,3:104,4:105,5:109,6:98,7:100,8:112,9:115,10:116}
          known={1:295,2:146,3:121,4:122,5:119,6:117,7:126,8:127,9:130,10:140}
          def feat(path):
              im=Image.open(path).convert('RGB').resize((64,36),Image.Resampling.BILINEAR)
              return list(im.getdata())
          files=[]
          for p in root.glob('*.png'):
              try:
                  im=Image.open(p)
                  w,h=im.size
                  if w>=400 and h>=220 and w/h>1.25 and w/h<2.2:
                      files.append((int(p.stem),p,w,h))
              except Exception: pass
          cache={i:feat(p) for i,p,_,_ in files}
          rows=[]
          for cam,base_id in bases.items():
              a=cache.get(base_id)
              if not a: continue
              scores=[]
              for sid,p,w,h in files:
                  b=cache[sid]
                  mse=sum((x-y)*(x-y) for pa,pb in zip(a,b) for x,y in zip(pa,pb))/(len(a)*3)
                  scores.append((mse,sid,p,w,h))
              scores.sort()
              top=scores[:24]
              # create contact sheet of nearest family members
              thumbs=[]
              for rank,(mse,sid,p,w,h) in enumerate(top):
                  im=Image.open(p).convert('RGB'); im.thumbnail((240,150),Image.Resampling.LANCZOS)
                  tile=Image.new('RGB',(260,185),'black'); tile.paste(im,((260-im.width)//2,5))
                  d=ImageDraw.Draw(tile)
                  tag='BASE' if sid==base_id else ('KNOWN' if sid==known[cam] else '')
                  d.text((6,160),f'ID {sid} {tag} mse={mse:.0f}',fill='white')
                  thumbs.append(tile)
                  rows.append([cam,rank,sid,w,h,mse,tag])
              sheet=Image.new('RGB',(260*4,185*6),'black')
              for i,t in enumerate(thumbs): sheet.paste(t,((i%4)*260,(i//4)*185))
              sheet.save(f'audit/cam{cam:02d}_nearest.jpg',quality=90)
          with open('audit/nearest.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['camera','rank','id','width','height','mse','tag']); w.writerows(rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: springtrap-camera-audit
          path: audit/*
          if-no-files-found: error
