name: Wii U WUP Diagnostic NUSspli Template v3

on:
  push:
    branches:
      - fix/restore-phone-subtitles

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl python3-pil openjdk-17-jre-headless

      - name: Build minimal official wut diagnostic RPX
        run: |
          make -C tools/wup_diag clean all
          test -s tools/wup_diag/diagnostic.rpx

      - name: Prepare NUSspli-compatible channel tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/wup-nusspli-v3 dist/wup-nusspli-v3
          mkdir -p build/wup-nusspli-v3/code build/wup-nusspli-v3/content build/wup-nusspli-v3/meta dist/wup-nusspli-v3

          cp tools/wup_diag/diagnostic.rpx build/wup-nusspli-v3/code/diagnostic.rpx
          printf '%s\n' 'FNaF3 WUP diagnostic v3 - NUSspli channel template' > build/wup-nusspli-v3/content/channel.txt

          curl -L --fail --retry 3 https://raw.githubusercontent.com/V10lator/NUSspli/master/meta/menu/app.xml -o build/wup-nusspli-v3/code/app.xml
          curl -L --fail --retry 3 https://raw.githubusercontent.com/V10lator/NUSspli/master/meta/menu/cos.xml -o build/wup-nusspli-v3/code/cos.xml
          curl -L --fail --retry 3 https://raw.githubusercontent.com/V10lator/NUSspli/master/meta/menu/meta.xml -o build/wup-nusspli-v3/meta/meta.xml

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import xml.etree.ElementTree as ET

          root = Path('build/wup-nusspli-v3')
          title_id = '000500001337D1A1'
          group_id = '0000D1A1'

          app_path = root/'code'/'app.xml'
          app = ET.parse(app_path)
          ar = app.getroot()
          ar.find('title_id').text = title_id
          ar.find('group_id').text = group_id
          ar.find('sdk_version').text = '20811'
          app.write(app_path, encoding='utf-8', xml_declaration=True)

          cos_path = root/'code'/'cos.xml'
          cos = ET.parse(cos_path)
          cr = cos.getroot()
          cr.find('argstr').text = 'diagnostic.rpx'
          cos.write(cos_path, encoding='utf-8', xml_declaration=True)

          meta_path = root/'meta'/'meta.xml'
          meta = ET.parse(meta_path)
          mr = meta.getroot()
          mr.find('title_id').text = title_id
          mr.find('group_id').text = group_id
          mr.find('product_code').text = 'WUP-P-DG3U'
          mr.find('network_use').text = '0'
          mr.find('bg_daemon_enable').text = '0'
          mr.find('common_save_size').text = '0000000000000000'
          mr.find('account_save_size').text = '0000000000100000'
          for child in mr:
              if child.tag.startswith('longname_'):
                  child.text = 'FNaF3 WUP Diagnostic v3'
              elif child.tag.startswith('shortname_'):
                  child.text = 'FNaF3 DIAG v3'
              elif child.tag.startswith('publisher_'):
                  child.text = 'Eitan1414'
          meta.write(meta_path, encoding='utf-8', xml_declaration=True)

          try:
              resampling = Image.Resampling.LANCZOS
          except AttributeError:
              resampling = Image.LANCZOS

          def load_icon():
              try:
                  im = Image.open('icon.jpg').convert('RGBA')
              except Exception:
                  im = Image.new('RGBA', (128,128), (0,0,0,255))
              return ImageOps.fit(im, (128,128), method=resampling)

          icon = load_icon()
          icon.save(root/'meta'/'iconTex.tga', format='TGA')

          for name,size in [('bootTvTex.tga',(1280,720)),('bootDrcTex.tga',(854,480))]:
              bg = Image.new('RGB', size, (0,0,0))
              small = icon.convert('RGB').copy()
              small.thumbnail((min(size)//3, min(size)//3), resampling)
              bg.paste(small, ((size[0]-small.width)//2,(size[1]-small.height)//2))
              bg.save(root/'meta'/name, format='TGA')

          assert ET.parse(app_path).getroot().find('version').text == '1'
          assert ET.parse(cos_path).getroot().find('version').text == '1'
          assert ET.parse(meta_path).getroot().find('version').text == '1'
          assert ET.parse(meta_path).getroot().find('launching_flag').text == '00000004'
          assert ET.parse(meta_path).getroot().find('closing_msg').text == '1'
          assert ET.parse(meta_path).getroot().find('reserved_flag0').text == '00010002'
          print('NUSspli-compatible XML template ready: app=1 cos=1 meta=1')
          PY

      - name: Pack diagnostic exactly through NUSPacker
        run: |
          test -n "$WIIU_COMMON_KEY"
          test "${#WIIU_COMMON_KEY}" -eq 32
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Maschell/nuspacker/master/NUSPacker.jar -o /tmp/NUSPacker.jar
          java -jar /tmp/NUSPacker.jar \
            -in build/wup-nusspli-v3 \
            -out dist/wup-nusspli-v3 \
            -encryptKeyWith "$WIIU_COMMON_KEY"

      - name: Validate diagnostic package
        run: |
          python3 tools/validate_wup.py \
            dist/wup-nusspli-v3 \
            build/wup-nusspli-v3/code/app.xml \
            build/wup-nusspli-v3/meta/meta.xml
          test -s dist/wup-nusspli-v3/title.tmd
          test -s dist/wup-nusspli-v3/title.tik
          test -s dist/wup-nusspli-v3/title.cert
          find dist/wup-nusspli-v3 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload NUSspli-template diagnostic WUP
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup-diagnostic-nusspli-v3
          if-no-files-found: error
          path: dist/wup-nusspli-v3/*
