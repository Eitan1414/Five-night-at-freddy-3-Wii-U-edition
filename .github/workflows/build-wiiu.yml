name: Build Wii U Homebrew

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fnaf3-wiiu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install asset tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg curl ca-certificates cmake patch unzip

      - name: Build official Wii U SDL2 port
        run: |
          git clone --depth 1 https://github.com/devkitPro/wut-packages.git /tmp/wut-packages
          curl -L --fail --retry 3 \
            https://libsdl.org/release/SDL2-2.32.10.tar.gz \
            -o /tmp/SDL2-2.32.10.tar.gz
          tar -xzf /tmp/SDL2-2.32.10.tar.gz -C /tmp
          cd /tmp/SDL2-2.32.10
          patch -p1 < /tmp/wut-packages/SDL2/SDL2-2.32.10.patch
          mkdir build
          cd build
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/portlibs/wiiu \
            -DSDL_TEST=OFF
          cmake --build . --parallel 2
          cmake --install .

      - name: Fetch original PSX visual and audio sources
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Soeiz/Five-Night-at-Freddys-3-PSX.git \
            /tmp/fnaf3-psx-original
          cd /tmp/fnaf3-psx-original
          git checkout f19e22762f48d4269e07730827d8eaab5995557b -- \
            tim/screamer tim/office tim/camera vag/screamer.vag xa/inter8.zip

      - name: Fetch pinned original PC audio source
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/softblueish/FNAF3.git \
            /tmp/fnaf3-pc-original
          cd /tmp/fnaf3-pc-original
          git checkout bdda89c00a6f5716956822ce01646013ca5708e1 -- assets/audio

      - name: Prepare generated assets
        env:
          FNAF3_PSX_SOURCE: /tmp/fnaf3-psx-original
          FNAF3_USER_AUDIO_ROOT: /tmp/fnaf3-pc-original/assets/audio
        run: sh tools/prepare_generated_assets.sh

      - name: Prepare authentic embedded Wii U audio
        env:
          FNAF3_PC_AUDIO_ROOT: /tmp/fnaf3-pc-original/assets/audio
        run: sh tools/prepare_wup_audio_content.sh

      - name: Verify authentic embedded audio
        run: |
          test "$(find data/audio -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 49
          test "$(find .wup-audio/audio -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 49
          for file in .wup-audio/audio/*.bin; do
            name="$(basename "$file")"
            test -s "data/audio/$name"
            cmp -s "$file" "data/audio/$name"
          done
          echo 'Verified 49 authentic PC cues for direct RPX embedding.'
          du -sh data/audio

      - name: Prepare startup intro
        run: sh tools/prepare_intro_assets.sh

      - name: Prepare WUHB packaged content
        run: |
          rm -rf .wuhb-content
          mkdir -p .wuhb-content/intro
          cp .wup-intro/intro.f3v .wup-intro/intro_audio.bin .wuhb-content/intro/
          test -s .wuhb-content/intro/intro.f3v
          test -s .wuhb-content/intro/intro_audio.bin
          test ! -d .wuhb-content/audio

      - name: Build WUHB
        run: make -j2

      - name: Verify native outputs
        run: |
          test -f fnaf3-wiiu.elf
          test -f fnaf3-wiiu.rpx
          test -f fnaf3-wiiu.wuhb
          test -f .wiiu-artwork/icon.png
          test -f .wiiu-artwork/boot-tv.png
          test -f .wiiu-artwork/boot-drc.png
          test "$(find data/audio -maxdepth 1 -type f -name '*.bin' | wc -l)" -eq 49
          test -s .wup-intro/intro.f3v
          test -s .wup-intro/intro_audio.bin
          ls -lh fnaf3-wiiu.elf fnaf3-wiiu.rpx fnaf3-wiiu.wuhb
          ls -lh .wiiu-artwork/*.png .wup-intro/*
          du -sh data/audio .wuhb-content

      - name: Generate code content meta tree
        run: |
          python3 tools/generate_wup_channel.py \
            --rpx fnaf3-wiiu.rpx \
            --output build-wup/channel
          mkdir -p build-wup/channel/content/intro
          cp .wup-intro/intro.f3v .wup-intro/intro_audio.bin build-wup/channel/content/intro/
          test ! -d build-wup/channel/content/audio
          test -s build-wup/channel/content/intro/intro.f3v
          test -s build-wup/channel/content/intro/intro_audio.bin
          du -sh build-wup/channel/content/intro

      - name: Validate restored Wii U artwork and packaged content
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          expected = {
              'iconTex.tga': (128, 128, 32),
              'bootTvTex.tga': (1280, 720, 24),
              'bootDrcTex.tga': (854, 480, 24),
          }
          meta = Path('build-wup/channel/meta')
          for filename, wanted in expected.items():
              data = (meta / filename).read_bytes()
              got = struct.unpack_from('<HHB', data, 12)
              if got != wanted:
                  raise SystemExit(f'{filename}: {got} != {wanted}')
              print(filename, got)
          for filename in ('meta.xml',):
              if not (meta / filename).is_file():
                  raise SystemExit(f'missing {filename}')
          for filename in ('app.xml', 'cos.xml', 'fnaf3-wiiu.rpx'):
              if not (Path('build-wup/channel/code') / filename).is_file():
                  raise SystemExit(f'missing {filename}')
          embedded_audio = sorted(Path('data/audio').glob('*.bin'))
          if len(embedded_audio) != 49:
              raise SystemExit(f'expected 49 embedded audio cues, got {len(embedded_audio)}')
          if any(path.stat().st_size == 0 for path in embedded_audio):
              raise SystemExit('one or more embedded audio cues are empty')
          if Path('build-wup/channel/content/audio').exists():
              raise SystemExit('audio must be embedded in the RPX, not duplicated in WUP content')
          intro = Path('build-wup/channel/content/intro')
          video = intro / 'intro.f3v'
          intro_audio = intro / 'intro_audio.bin'
          if video.read_bytes()[:4] != b'F3I2':
              raise SystemExit('invalid startup intro header')
          if intro_audio.stat().st_size == 0:
              raise SystemExit('startup intro audio is empty')
          print('embedded authentic audio cues:', len(embedded_audio))
          print('startup intro bytes:', video.stat().st_size, intro_audio.stat().st_size)
          PY

      - name: Package encrypted WUP installer when key is configured
        id: package
        env:
          WIIU_COMMON_KEY: ${{ secrets.WIIU_COMMON_KEY }}
        run: |
          if printf '%s' "$WIIU_COMMON_KEY" | grep -Eq '^[0-9A-Fa-f]{32}$'; then
            apt-get update -qq
            apt-get install -y --no-install-recommends openjdk-17-jre-headless
            chmod +x tools/package_wup.sh
            tools/package_wup.sh build-wup/channel build-wup/install
            echo 'packaged=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::WIIU_COMMON_KEY is not configured; the complete code/content/meta channel was generated, but encrypted WUP files were skipped.'
            echo 'packaged=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify encrypted WUP installer
        if: steps.package.outputs.packaged == 'true'
        run: |
          test -n "$(find build-wup/install -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$(find build-wup/install -maxdepth 1 -name '*.h3' -print -quit)"
          test -f build-wup/install/title.tik
          test -f build-wup/install/title.tmd
          test -f build-wup/install/title.cert
          ls -lh build-wup/install

      # Artifact storage can temporarily be full. Packaging is deliberately
      # completed before these optional uploads, so a quota error cannot skip
      # or invalidate the WUP build itself.
      - name: Upload native Wii U build
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-native
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
          path: |
            fnaf3-wiiu.elf
            fnaf3-wiiu.rpx
            fnaf3-wiiu.wuhb

      - name: Upload WUP channel source
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup-channel
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
          path: build-wup/channel/**

      - name: Upload WUP install package
        if: steps.package.outputs.packaged == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup-install
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
          path: build-wup/install/**