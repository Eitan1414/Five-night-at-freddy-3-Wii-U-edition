name: Build Wii U Homebrew

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503
    env:
      WIIU_COMMON_KEY: ${{ secrets.ENC_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install asset and WUP tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg curl ca-certificates cmake patch python3-pil unzip openjdk-17-jre-headless

      - name: Build official Wii U SDL2 port
        run: |
          git clone --depth 1 https://github.com/devkitPro/wut-packages.git /tmp/wut-packages
          curl -L --fail --retry 3 \
            https://libsdl.org/release/SDL2-2.32.10.tar.gz \
            -o /tmp/SDL2-2.32.10.tar.gz
          tar -xzf /tmp/SDL2-2.32.10.tar.gz -C /tmp
          cd /tmp/SDL2-2.32.10
          patch -p1 < /tmp/wut-packages/SDL2/SDL2-2.32.10.patch
          mkdir build
          cd build
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/devkitpro/portlibs/wiiu \
            -DSDL_TEST=OFF
          cmake --build . --parallel 2
          cmake --install .

      - name: Fetch original PSX visual and audio sources
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/Soeiz/Five-Night-at-Freddys-3-PSX.git \
            /tmp/fnaf3-psx-original
          cd /tmp/fnaf3-psx-original
          git checkout f19e22762f48d4269e07730827d8eaab5995557b -- \
            tim/screamer tim/office tim/camera vag/screamer.vag xa/inter8.zip

      - name: Fetch verified PC General Sprites source
        shell: bash
        run: |
          set -euo pipefail
          ASSET_PAGE="https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          mkdir -p /tmp/fnaf3-pc-general
          curl -L --fail --retry 3 -A "Mozilla/5.0" "$ASSET_PAGE" -o /tmp/fnaf3-general-page.html

          DOWNLOAD_URL="$(python3 - <<'PY'
          import html
          import re
          from urllib.parse import urljoin

          page_url = "https://www.spriters-resource.com/pc_computer/fivenightsatfreddys3/asset/65675/"
          text = open("/tmp/fnaf3-general-page.html", encoding="utf-8", errors="ignore").read()
          text = html.unescape(text)

          candidates = []
          patterns = [
              r'''href\s*=\s*["']([^"']+)["']''',
              r'''(?:data-url|data-download|action)\s*=\s*["']([^"']+)["']''',
              r'''https?://[^"'<>\\s]+''',
          ]
          for pattern in patterns:
              for match in re.findall(pattern, text, flags=re.I):
                  value = match if isinstance(match, str) else match[0]
                  value = value.strip()
                  low = value.lower()
                  if ("download" in low or low.endswith(".zip") or "65675" in low) and value not in candidates:
                      candidates.append(value)

          ranked = sorted(
              candidates,
              key=lambda value: (
                  not value.lower().endswith(".zip"),
                  "download" not in value.lower(),
                  "65675" not in value,
                  len(value),
              ),
          )
          for value in ranked:
              absolute = urljoin(page_url, value)
              if absolute.rstrip("/") == page_url.rstrip("/"):
                  continue
              print(absolute)
              break
          PY
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not resolve the current General Sprites ZIP URL from asset 65675."
            exit 1
          fi
          echo "Resolved General Sprites download: $DOWNLOAD_URL"
          curl -L --fail --retry 3 \
            -A "Mozilla/5.0" \
            -H "Referer: $ASSET_PAGE" \
            "$DOWNLOAD_URL" \
            -o /tmp/fnaf3-general-sprites.zip

          echo "b083700bfbcbe0254c59a3f4acf451f6c647c20719a6db2ea29c8f4a644c6a23  /tmp/fnaf3-general-sprites.zip" | sha256sum -c -
          unzip -q /tmp/fnaf3-general-sprites.zip -d /tmp/fnaf3-pc-general
          test -f /tmp/fnaf3-pc-general/DataDump3/203.png
          test -f /tmp/fnaf3-pc-general/DataDump3/106.png
          test -f /tmp/fnaf3-pc-general/DataDump3/97.png
          test -f /tmp/fnaf3-pc-general/DataDump3/295.png
          test -f /tmp/fnaf3-pc-general/DataDump3/823.png

      - name: Prepare generated assets
        env:
          FNAF3_PSX_SOURCE: /tmp/fnaf3-psx-original
        run: |
          sh tools/prepare_generated_assets.sh
          python3 tools/convert_pc_general_sprites.py \
            /tmp/fnaf3-pc-general/DataDump3 \
            source/pc_core_visuals.c \
            include/assets/pc_core_visuals.h
          python3 tools/convert_pc_character_visuals.py \
            /tmp/fnaf3-pc-general/DataDump3 \
            source/pc_character_visuals.c \
            include/assets/pc_character_visuals.h

      - name: Build WUHB and RPX
        run: make -j2

      - name: Build installable WUP channel
        if: ${{ env.WIIU_COMMON_KEY != '' && github.event_name != 'pull_request' }}
        run: sh tools/build_wup_channel.sh

      - name: Validate installable WUP package
        if: ${{ env.WIIU_COMMON_KEY != '' && github.event_name != 'pull_request' }}
        run: python3 tools/validate_wup.py dist/fnaf3-wiiu-wup wup/app.xml wup/meta.xml

      - name: WUP packaging key notice
        if: ${{ env.WIIU_COMMON_KEY == '' && github.event_name != 'pull_request' }}
        run: echo "::warning::ENC_KEY repository secret is missing; WUP .app/.h3 packaging was skipped."

      - name: Verify homebrew outputs
        run: |
          test -f fnaf3-wiiu.elf
          test -f fnaf3-wiiu.rpx
          test -f fnaf3-wiiu.wuhb
          ls -lh fnaf3-wiiu.elf fnaf3-wiiu.rpx fnaf3-wiiu.wuhb

      - name: Upload Wii U homebrew build
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu
          if-no-files-found: error
          path: |
            fnaf3-wiiu.elf
            fnaf3-wiiu.rpx
            fnaf3-wiiu.wuhb

      - name: Upload installable WUP build
        if: ${{ env.WIIU_COMMON_KEY != '' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: fnaf3-wiiu-wup
          if-no-files-found: error
          path: dist/fnaf3-wiiu-wup/*
